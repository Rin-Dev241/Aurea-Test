<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <meta name="theme-color" content="#D4A574" />
    <title>Reminders — Aurea</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/reminders.css" />
    <link rel="icon" type="image/png" href="/assets/icons/aurea.png" />
    <link rel="apple-touch-icon" href="/assets/icons/aurea.png" />
  </head>
  <body>
    <div class="app-container">
      <!-- Header -->
      <div class="page-header">
        <button class="back-btn" onclick="navigateTo('dashboard.html')">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M15 18l-6-6 6-6" />
          </svg>
        </button>
        <h1 class="text-h2">Daily Reminders</h1>
        <div style="width: 40px"></div>
      </div>

      <!-- Today's Quote Card -->
      <div class="quote-card" id="quoteCard">
        <div class="quote-mark">"</div>
        <p class="quote-text" id="quoteText">Loading...</p>
        <p class="quote-source" id="quoteSource"></p>
        <div style="margin-top: 12px">
          <label class="toggle-label">
            <span style="font-size: 13px; color: rgba(255, 255, 255, 0.8)"
              >Bible Verses</span
            >
            <label class="toggle">
              <input
                type="checkbox"
                id="quoteTypeToggle"
                onchange="toggleQuoteType()"
              />
              <span class="toggle-slider"></span>
            </label>
          </label>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tab-bar" style="margin-top: 16px">
        <button class="tab active" onclick="switchReminderTab('today', this)">
          Today
        </button>
        <button class="tab" onclick="switchReminderTab('all', this)">
          All
        </button>
        <button class="tab" onclick="switchReminderTab('completed', this)">
          Done
        </button>
      </div>

      <!-- Reminder List -->
      <div class="reminder-list" id="reminderList">
        <!-- Populated by JS -->
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="emptyReminders">
        <div class="empty-icon">📋</div>
        <p class="text-body">No reminders yet</p>
        <p class="text-caption">Tap + to add your first reminder</p>
      </div>

      <!-- FAB -->
      <button class="fab" onclick="showAddReminder()">+</button>

      <!-- Add/Edit Reminder Modal -->
      <div class="modal" id="reminderModal">
        <div class="modal-backdrop" onclick="closeReminderModal()"></div>
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="text-h3" id="reminderModalTitle">Add Reminder</h2>
            <button class="modal-close" onclick="closeReminderModal()">
              ✕
            </button>
          </div>

          <form id="reminderForm" onsubmit="saveReminder(event)">
            <div class="form-group">
              <label class="form-label">Title</label>
              <input
                type="text"
                class="form-input"
                id="reminderTitle"
                placeholder="e.g., Take medicine"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Time</label>
              <input
                type="time"
                class="form-input"
                id="reminderTime"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label">Category</label>
              <div class="category-chips">
                <button
                  type="button"
                  class="chip active"
                  data-cat="medication"
                  onclick="selectCategory('medication', this)"
                >
                  💊 Medication
                </button>
                <button
                  type="button"
                  class="chip"
                  data-cat="exercise"
                  onclick="selectCategory('exercise', this)"
                >
                  🏃 Exercise
                </button>
                <button
                  type="button"
                  class="chip"
                  data-cat="meal"
                  onclick="selectCategory('meal', this)"
                >
                  🍽️ Meal
                </button>
                <button
                  type="button"
                  class="chip"
                  data-cat="appointment"
                  onclick="selectCategory('appointment', this)"
                >
                  📅 Appointment
                </button>
                <button
                  type="button"
                  class="chip"
                  data-cat="activity"
                  onclick="selectCategory('activity', this)"
                >
                  🎯 Activity
                </button>
                <button
                  type="button"
                  class="chip"
                  data-cat="other"
                  onclick="selectCategory('other', this)"
                >
                  📝 Other
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label">Repeat</label>
              <select class="form-input" id="reminderRepeat">
                <option value="none">Don't repeat</option>
                <option value="daily">Every day</option>
                <option value="weekdays">Weekdays</option>
                <option value="weekly">Weekly</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label">Notes (optional)</label>
              <textarea
                class="form-input"
                id="reminderNotes"
                rows="2"
                placeholder="Add any notes..."
              ></textarea>
            </div>

            <input type="hidden" id="editReminderId" value="" />

            <button type="submit" class="btn btn-primary btn-block">
              Save Reminder
            </button>
          </form>
        </div>
      </div>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav" id="bottomNav">
        <a href="dashboard.html" class="nav-item">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          <span>Home</span>
        </a>
        <a href="emotion.html" class="nav-item">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <path d="M8 14s1.5 2 4 2 4-2 4-2" />
            <line x1="9" y1="9" x2="9.01" y2="9" />
            <line x1="15" y1="9" x2="15.01" y2="9" />
          </svg>
          <span>Emotions</span>
        </a>
        <a href="games.html" class="nav-item">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="2" width="20" height="20" rx="5" />
            <path d="M12 8v8M8 12h8" />
          </svg>
          <span>Games</span>
        </a>
        <a href="reminders.html" class="nav-item active">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
          <span>Reminders</span>
        </a>
        <a href="alerts.html" class="nav-item">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            />
          </svg>
          <span>Care</span>
        </a>
      </nav>
    </div>

    <script src="../assets/js/firebase-config.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/reminders.js"></script>
    <div class="toast-container" id="toastContainer"></div>
  </body>
</html>
